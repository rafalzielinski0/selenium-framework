name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write   # potrzebne do publikacji na gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Pobierz poprzedni raport z gh-pages żeby Allure mógł budować wykresy trendów.
      # continue-on-error: true – nie blokuje pierwszego uruchomienia gdy gh-pages nie istnieje.
      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history to results dir
        continue-on-error: true
        run: |
          mkdir -p build/allure-results
          cp -r gh-pages/history build/allure-results/history 2>/dev/null || true

      - name: Run tests
        # Chrome jest preinstalowany na ubuntu-latest pod /usr/bin/google-chrome.
        # -PbrowserBinary nadpisuje ścieżkę z gradle.properties (lokalny wrapper Flatpak).
        # --no-daemon zalecane w CI – unika problemów z procesem Gradle daemon.
        run: ./gradlew test --no-daemon -PbrowserBinary=/usr/bin/google-chrome

      # Zapisz surowe wyniki zawsze – nawet gdy testy failują – żeby móc zbadać błędy.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          retention-days: 30

      - name: Generate Allure report
        if: always()
        # -x test pomija zadanie test (już wykonane wyżej, wyniki są świeże)
        run: ./gradlew allureReport --no-daemon -x test

      # Publikuj raport tylko z głównej gałęzi (nie z PR – brak uprawnień zapisu)
      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/reports/allure-report/allureReport
