# Katalog z surowymi wynikami testów (wejście dla allureReport)
allure.results.directory=build/allure-results

# Linki do systemu ticketowego i TMS – %s zastępuje ID z @Issue / @TmsLink
allure.link.issue.pattern=https://jira.example.com/browse/{}
allure.link.tms.pattern=https://testrail.example.com/index.php?/cases/view/{}

# Nazwy kolumn w sekcji "Environment" w raporcie
allure.label.layer=UI
allure.label.owner=QA Team
